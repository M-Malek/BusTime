[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ztm-tools"
version = "0.1.0"
description = "Set of packages for ZTM statistic app."
authors = [
  { name = "Michal Malek" }
]
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

dependencies = [
    "requests",
    "numpy",
    "pandas",
    "logging",
    "os",
]


[tool.setuptools]
packages = ["find:"]

[tool.setuptools.packages.find]
where = ["src"]

